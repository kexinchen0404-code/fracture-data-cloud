name: Consolidate current BCER well reports into Excel
on:
  push:
    branches: ['codex/bcer-all-wells']
    paths: ['.github/workflows/bcer-consolidate.yml','cloud/consolidation_request.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  available:
    uses: ./.github/workflows/bcer-workbook-assembly.yml
    with:
      stage: available
  final:
    needs: available
    if: always()
    uses: ./.github/workflows/bcer-workbook-assembly.yml
    with:
      stage: final
