name: Verify perforation cluster tables and update the all-well workbook
on:
  push:
    branches: ['codex/bcer-all-wells']
    paths: ['.github/workflows/bcer-cluster-review.yml','cloud/cluster_request.txt']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: bcer-cluster-review
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Select all current reports with confirmed stage measurements
        env:
          GH_TOKEN: ${{ github.token }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN || secrets.TURSO_DATABASE_AUTH_TOKEN || secrets.TURSO_TOKEN || secrets.LIBSQL_AUTH_TOKEN }}
        run: |
          python -m pip install -q lxml
          gh run download 44713891504 --name verified-stage-catalog-latest-reviewed --dir baseline
          gh run download 44713891504 --name BCER-current-workbook-latest-reviewed --dir baseline
          python cloud/perforation_clusters.py plan
  check:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {group: [0,1,2,3,4,5,6,7]}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install -q 'pypdf>=5,<7'
      - name: Read the immutable source and privately store numbered perforations
        env:
          BCER_USERNAME: ${{ secrets.BCER_USERNAME }}
          BCER_PASSWORD: ${{ secrets.BCER_PASSWORD }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN || secrets.TURSO_DATABASE_AUTH_TOKEN || secrets.TURSO_TOKEN || secrets.LIBSQL_AUTH_TOKEN }}
          GROUP: ${{ matrix.group }}
        run: python cloud/perforation_clusters.py scan "$GROUP"
  workbook:
    needs: check
    uses: ./.github/workflows/bcer-workbook-assembly.yml
    with:
      stage: cluster-reviewed
    secrets:
      catalog_token: ${{ secrets.TURSO_AUTH_TOKEN || secrets.TURSO_DATABASE_AUTH_TOKEN || secrets.TURSO_TOKEN || secrets.LIBSQL_AUTH_TOKEN }}
