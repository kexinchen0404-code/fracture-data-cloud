name: Assemble BCER report measurements
on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
    secrets:
      catalog_token:
        required: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: ${{ inputs.stage == 'available' && 'bcer-available-report-workbook' || 'bcer-current-report-extraction' }}
      cancel-in-progress: false
    env:
      STAGE: ${{ inputs.stage }}
      RESULT_TAG: bcer-report-index-44541449531-v1
      NATIVE_SHA: 45952efee934feb7ae02ee689482dd4b1fa8f4078ac3b6be467627007609f78c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Open verified regulator data and report sheets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet 'xlsxwriter==3.2.9' 'lxml>=5,<7'
          mkdir -p tmp/curve_read/merged_sheets data/bcer_current
          unzip -q cloud/verified-report-sheets.zip -d tmp/curve_read/merged_sheets
          cp tmp/curve_read/merged_sheets/source_manifest.json data/bcer_current/
          asset="bcer-native-20261110-${NATIVE_SHA:0:12}.zip"
          need_cache=0
          if gh release download "$RESULT_TAG" --pattern "$asset" --dir data/bcer_current; then
            mv "data/bcer_current/$asset" data/bcer_current/hydraulic_fracture_csv.zip
          else
            need_cache=1
            curl --fail --location --retry 4 --silent --show-error https://iris.bcogc.ca/download/hydraulic_fracture_csv.zip -o data/bcer_current/hydraulic_fracture_csv.zip
          fi
          echo "$NATIVE_SHA  data/bcer_current/hydraulic_fracture_csv.zip" | sha256sum --check
          if [ "$STAGE" = available ] && [ "$need_cache" = 1 ]; then
            ln data/bcer_current/hydraulic_fracture_csv.zip "$asset"
            gh release upload "$RESULT_TAG" "$asset"
          fi
      - name: Collect verified perforations for the current report hashes
        if: inputs.stage == 'cluster-reviewed'
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.catalog_token }}
        run: python cloud/perforation_clusters.py collect
      - name: Collect current group records and verify the workbook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 cloud/build_bcer_all_wells.py
          python3 cloud/compile_checkpoints.py --tag "$RESULT_TAG"
          python3 cloud/merge_pdf_workbook.py
          python3 cloud/verify_scientific_cells.py
          python3 cloud/export_stage_catalog.py
          ln outputs/*/*.xlsx BCER-fracture-stages-current.xlsx
      - name: Reconcile every well and missing-value state before publication
        if: inputs.stage == 'latest-reviewed' || inputs.stage == 'cluster-reviewed'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('tmp/curve_read/merged_sheets');s=json.loads((d/'snapshot.json').read_text())
          assert s['groups_saved']==s['groups_expected']==128
          assert s['wells_complete']+s['wells_unresolved']==s['directory_wells_indexed']==s['total_directories']
          assert s['latest_wells']>=s['total_directories'] and s['wells_pending_in_saved_groups']==0
          assert s['well_values_retained']+s['well_values_missing']+s['well_values_unsortable']==s['latest_wells']*s['latest_fields']
          tabs=json.loads((d/'tabs.json').read_text());t=next(t for t in tabs if t['name']=='PDF未读报告')
          unresolved=[json.loads(line) for line in (d/t['rows_file']).open(encoding='utf-8')]
          assert len(unresolved)==s['unread_or_revision_held_rows'] and len(unresolved)>=s['reports_unresolved']>=s['wells_unresolved']
          assert all(r[0] and r[1] and r[5] and r[6] and r[7] for r in unresolved)
          print('WELL_STATES_VERIFIED',s['latest_wells'],s['latest_fields'],s['source_coverage_status'],len(unresolved))
          PY
      - uses: actions/upload-artifact@v4
        if: inputs.stage != 'cluster-reviewed'
        with:
          name: verified-stage-catalog-${{ inputs.stage }}
          path: verified-stage-catalog.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.stage != 'cluster-reviewed'
        with:
          name: BCER-current-workbook-${{ inputs.stage }}
          path: BCER-fracture-stages-current.xlsx
          compression-level: 0
          retention-days: 14
      - name: Store workbook and coverage on the cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tmp/curve_read/merged_sheets/snapshot.json BCER-report-coverage-current.json
          if [ "$STAGE" = cluster-reviewed ]; then
            test "$(gh release view "$RESULT_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RESULT_TAG" verified-stage-catalog.zip --clobber
          fi
          gh release upload "$RESULT_TAG" BCER-fracture-stages-current.xlsx BCER-report-coverage-current.json --clobber
          gh release view "$RESULT_TAG" --json url --jq .url
      - name: Publish and read back the current structured research catalog
        if: inputs.stage == 'cluster-reviewed'
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.catalog_token }}
        run: python cloud/publish_fracture_catalog.py
      - name: Verify final source coverage
        if: inputs.stage == 'final'
        run: python3 -c 'import json; s=json.load(open("BCER-report-coverage-current.json")); assert s["groups_saved"]==s["groups_expected"] and s["wells_complete"]==s["total_directories"] and s["reports_unresolved"]==0, s'
