name: Recover remaining BCER reports and verify all-well workbook
on:
  push:
    branches: ['codex/bcer-all-wells']
    paths: ['cloud/recovery_request.json']
  workflow_dispatch:
  workflow_call:
    inputs:
      groups:
        type: string
        required: true
    secrets:
      BCER_USERNAME:
        required: true
      BCER_PASSWORD:
        required: true
permissions:
  contents: read
env:
  RESULT_TAG: bcer-report-index-44541449531-v1
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
      publish: ${{ steps.list.outputs.publish }}
      audit: ${{ steps.list.outputs.audit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: list
        env:
          INPUT_GROUPS: ${{ inputs.groups }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,pathlib,os
          request=({'groups':json.loads(os.environ['INPUT_GROUPS']),'publish':False,'audit':False}
                   if os.environ.get('INPUT_GROUPS') else json.loads(pathlib.Path('cloud/recovery_request.json').read_text()))
          if isinstance(request,list):request={'groups':request}
          groups=request['groups']
          assert groups and len(groups)==len(set(groups)) and all(type(x)==int and 0<=x<128 for x in groups)
          print('groups='+json.dumps(groups))
          print('publish='+str(request.get('publish',True)).lower())
          print('audit='+str(request.get('audit',False)).lower())
          PY
  revisions:
    needs: select
    if: needs.select.outputs.audit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check all report families for a newer source modification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud/revision_audit.py --tag "$RESULT_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: revision-audit
          path: revision-audit.json
          retention-days: 14
  retry:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.select.outputs.groups) }}
    concurrency:
      group: bcer-report-recovery-${{ matrix.group }}
      cancel-in-progress: false
    env:
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore latest checked group
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_GROUPS: ${{ inputs.groups }}
        run: |
          options=()
          if [ -n "$INPUT_GROUPS" ]; then options+=(--revisions-only); fi
          python3 cloud/recover_reports.py restore --group "$GROUP" "${options[@]}"
      - name: Install readers for the failed source reports
        run: |
          python3 -m pip install --quiet 'pypdfium2>=4.30,<6' 'pdfplumber>=0.11.7,<0.12' 'PyMuPDF>=1.24,<2' pypdf
          if ! command -v pdftotext >/dev/null || ! command -v qpdf >/dev/null; then sudo apt-get update -qq && sudo apt-get install -qy poppler-utils qpdf; fi
          if ! command -v tesseract >/dev/null; then sudo apt-get update -qq && sudo apt-get install -qy tesseract-ocr tesseract-ocr-eng; fi
      - name: Read original reports with page and SHA-256 checks
        env:
          BCER_USERNAME: ${{ secrets.BCER_USERNAME }}
          BCER_PASSWORD: ${{ secrets.BCER_PASSWORD }}
        run: python3 cloud/recover_reports.py retry --group "$GROUP"
      - name: Save verified recovery checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="group-$GROUP-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sqlite.gz"
          gzip -1 -c result/extraction.sqlite > "$name"
          gzip -t "$name"
          gh release upload "$RESULT_TAG" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-receipt-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            result/receipts.json
            result/progress.json
          retention-days: 14
      - name: Reconcile source coverage
        if: inputs.groups == ''
        run: python3 -c 'import json; v=json.load(open("result/progress.json")); assert v["wells_unresolved"]==v["wells_pending"]==v["reports_failed_or_deferred"]==0, v'
      - name: Verify latest source revisions
        if: inputs.groups != ''
        run: PYTHONPATH=cloud python3 -c 'import sqlite3;from revision_audit import outdated; db=sqlite3.connect("result/extraction.sqlite"); assert not outdated(db)[0]'
  workbook:
    needs: [select, retry]
    if: always() && needs.select.outputs.publish == 'true' && needs.retry.result != 'cancelled'
    permissions:
      contents: write
    uses: ./.github/workflows/bcer-workbook-assembly.yml
    with:
      stage: final
